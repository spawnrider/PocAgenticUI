[project]
site_name = "ProtoAgenticUI"
site_description = "POC omnicanal headless : UI pilotée par le serveur (A2UI), agent Mastra (AG-UI), outils MCP derrière agentgateway."
site_url = "https://spawnrider.github.io/PocAgenticUI/"
repo_url = "https://github.com/spawnrider/PocAgenticUI"
repo_name = "spawnrider/PocAgenticUI"
nav = [
  { "Accueil" = "index.md" },
  { "Architecture" = [
    { "Présentation" = "architecture/README.md" },
    { "Vue d'ensemble" = "architecture/01-vue-ensemble.md" },
    { "Architecture détaillée" = "architecture/02-architecture-detaillee.md" },
    { "Diagrammes" = "architecture/diagrammes.md" },
    { "Diagramme interactif" = "architecture/diagramme-interactif.md" },
  ] },
  { "Spécifications" = [
    { "Architecture (spec)" = "specs/00-architecture.md" },
    { "Contrats" = "specs/01-contrats.md" },
  ] },
  { "Plan" = [
    { "Plan de réalisation" = "plan/00-plan.md" },
    { "État d'avancement" = "plan/STATUS.md" },
  ] },
  { "ADR" = [
    { "Index" = "adr/README.md" },
    { "0001 TypeScript côté serveur" = "adr/0001-typescript-cote-serveur.md" },
    { "0002 A2UI v0.9" = "adr/0002-a2ui-v0-9-catalogue-custom.md" },
    { "0003 AG-UI" = "adr/0003-ag-ui-transport-agent-ui.md" },
    { "0004 Agent Mastra" = "adr/0004-agent-mastra-express-par-requete.md" },
    { "0005 agentgateway et token exchange" = "adr/0005-agentgateway-token-exchange.md" },
    { "0006 Garde-fou d'écriture" = "adr/0006-garde-fou-ecriture-cote-serveur.md" },
    { "0007 SDUI Strapi, BFF, Unleash" = "adr/0007-sdui-strapi-bff-unleash.md" },
    { "0008 CopilotKit v2" = "adr/0008-copilotkit-v2-runtime.md" },
    { "0009 LLM simulé" = "adr/0009-llm-simule-pour-les-tests.md" },
    { "0010 MCP Apps non retenu" = "adr/0010-mcp-apps-non-retenu.md" },
  ] },
]

[project.theme]
language = "fr"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Thème automatique"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Thème sombre"
