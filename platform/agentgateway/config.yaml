# NON TESTÉ — à valider contre la doc agentgateway (schéma standalone).
binds:
- port: 3000
  listeners:
  - routes:
    - matches: [ { path: { pathPrefix: /mcp } } ]
      policies:
        cors: { allowOrigins: ["*"], allowHeaders: ["*"] }
        mcpAuthentication:
          issuer: http://keycloak:8080/realms/poc
          audiences: [agentgateway]
          jwks: { url: http://keycloak:8080/realms/poc/protocol/openid-connect/certs }
          resourceMetadata:
            resource: http://localhost:3000/mcp
            scopesSupported: [crm.read, crm.write]
            bearerMethodsSupported: [header]
        mcpAuthorization:
          rules:
          - 'mcp.tool.name == "crm_get_customer" && "crm.read" in jwt.scope'
          - 'mcp.tool.name == "crm_update_email" && "crm.write" in jwt.scope'
      backends:
      - mcp:
          targets:
          - name: crm
            mcp: { host: http://mcp-crm:3101/mcp }
