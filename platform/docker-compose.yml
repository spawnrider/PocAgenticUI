# NON TESTÉ — squelette POC. Lancer : docker compose --env-file ../.env up -d
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data, ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev","--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    volumes: ["./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["8080:8080"]
  unleash:
    image: unleashorg/unleash-server:latest
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "${UNLEASH_ADMIN_TOKEN}"
      INIT_FRONTEND_API_TOKENS: "${UNLEASH_FRONTEND_TOKEN}"
    ports: ["4242:4242"]
  strapi:
    build: ../services/strapi   # généré via `npx create-strapi@latest` (voir README)
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_NAME: strapi
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["1337:1337"]
  registry:
    image: ghcr.io/stacklok/toolhive-registry-server:latest   # à vérifier (nom d'image/config)
    volumes: ["./registry/registry.json:/data/registry.json:ro"]
    ports: ["8082:8080"]
  mcp-crm:
    build: ../services/mcp-crm
    ports: ["3101:3101"]
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    command: ["-f","/etc/agentgateway/config.yaml"]
    volumes: ["./agentgateway/config.yaml:/etc/agentgateway/config.yaml:ro"]
    depends_on: [keycloak, mcp-crm]
    ports: ["3000:3000","15000:15000"]
  bff:
    build: ../services/bff
    env_file: ../.env
    environment:
      STRAPI_URL: http://strapi:1337
      REDIS_URL: redis://redis:6379
      UNLEASH_URL: http://unleash:4242/api
      GATEWAY_URL: http://agentgateway:3000
    depends_on: [redis, strapi, unleash, agentgateway]
    ports: ["4000:4000"]
  agent:
    build: ../services/agent
    env_file: ../.env
    environment:
      GATEWAY_MCP_URL: http://agentgateway:3000/mcp
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/poc
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres/mastra"
    depends_on: [postgres, agentgateway]
    ports: ["4111:4111"]
volumes: { pgdata: {} }
